<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Clientes | Loja de Roupas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Cadastro de Clientes</h1>
      <p>Controle digital de clientes, compras e pagamentos da loja de roupas.</p>
    </header>

    <main>
      <section class="card">
        <h2>Novo cliente</h2>
        <form id="customer-form">
          <div class="grid">
            <label>
              Nome
              <input type="text" id="name" required maxlength="80" />
            </label>
            <label>
              Telefone
              <input type="tel" id="phone" placeholder="(00) 00000-0000" required />
            </label>
            <label>
              E-mail
              <input type="email" id="email" placeholder="cliente@email.com" />
            </label>
            <label>
              Limite de crédito (R$)
              <input type="number" id="limit" min="0" step="0.01" value="0" />
            </label>
          </div>
          <button type="submit">Cadastrar cliente</button>
        </form>
      </section>

      <section class="card">
        <div class="section-header">
          <h2>Clientes cadastrados</h2>
          <input type="search" id="search" placeholder="Buscar por nome ou telefone" />
        </div>
        <div id="customers-list" class="customers-list"></div>
      </section>
    </main>

    <template id="customer-template">
      <article class="customer-item">
        <div class="customer-main">
          <h3 class="customer-name"></h3>
          <p class="customer-contact"></p>
          <p class="customer-credit"></p>
        </div>

        <div class="customer-finance">
          <p class="customer-debt"></p>
          <span class="badge"></span>
        </div>

        <details>
          <summary>Editar cliente</summary>
          <form class="edit-form inline-grid">
            <label>Nome <input type="text" class="edit-name" required /></label>
            <label>Telefone <input type="tel" class="edit-phone" required /></label>
            <label>E-mail <input type="email" class="edit-email" /></label>
            <label>Limite (R$) <input type="number" class="edit-limit" min="0" step="0.01" /></label>
            <button type="submit">Salvar edição</button>
          </form>
        </details>

        <form class="purchase-form inline-grid">
          <h4>Registrar compra</h4>
          <label>
            Valor da compra (R$)
            <input type="number" class="purchase-amount" min="0.01" step="0.01" required />
          </label>
          <label>
            Data da compra
            <input type="date" class="purchase-date" required />
          </label>
          <label>
            Vencimento
            <input type="date" class="purchase-due" required />
          </label>
          <button type="submit">Salvar compra</button>
        </form>

        <form class="payment-form inline-grid">
          <h4>Registrar pagamento</h4>
          <label>
            Valor pago (R$)
            <input type="number" class="payment-amount" min="0.01" step="0.01" required />
          </label>
          <button type="submit">Salvar pagamento</button>
        </form>

        <div class="history">
          <h4>Compras</h4>
          <ul class="purchase-history"></ul>
        </div>

        <div class="history">
          <h4>Pagamentos</h4>
          <ul class="payment-history"></ul>
        </div>

        <button class="delete-btn" type="button">Excluir cliente</button>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
